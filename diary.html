<style>
:root {
  --pink: #F2C4CE;
  --pink-light: #FAE8EC;
  --pink-deep: #D4849A;
  --pink-btn: #C87090;
  --cream: #FDF6F0;
  --warm: #F9EDE3;
  --sage: #C8D8C0;
  --sage-light: #E8F0E4;
  --lavender: #D4C8E8;
  --lav-light: #EDE8F8;
  --yellow: #F7E8C0;
  --yellow-light: #FDF4DC;
  --text: #5C4A52;
  --text-light: #9C8890;
  --text-lighter: #C0AEB4;
  --white: #FFFFFF;
  --shadow: rgba(212,132,154,0.15);
  --shadow-deep: rgba(212,132,154,0.25);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
  background: var(--cream);
  color: var(--text);
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(ellipse at 10% 10%, rgba(242,196,206,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 90%, rgba(200,216,192,0.2) 0%, transparent 50%);
}

/* ===== HEADER ===== */
.header {
  flex-shrink: 0;
  order: 1;
  text-align: center;
  padding: 12px 16px 10px;
  background: rgba(253,246,240,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(242,196,206,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.header-deco {
  font-size: 16px;
  letter-spacing: 6px;
  margin-bottom: 2px;
  opacity: 0.7;
}

.header-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 4px;
}

.header-title span {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  font-weight: 500;
  margin-top: 5px;
  letter-spacing: 2px;
}

/* ===== TABS (bottom nav) ===== */
.tabs {
  flex-shrink: 0;
  display: flex;
  background: white;
  border-top: 1px solid rgba(242,196,206,0.4);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -4px 20px rgba(212,132,154,0.1);
  order: 3;
}

.tab {
  flex: 1;
  padding: 10px 4px 8px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 11px;
  color: var(--text-lighter);
  cursor: pointer;
  transition: all 0.2s;
  border-top: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.tab .tab-icon { font-size: 22px; }
.tab.active { color: var(--pink-deep); border-top-color: var(--pink-deep); background: var(--pink-light); }

/* ===== CONTENT ===== */
.content {
  flex: 1;
  overflow: hidden;
  position: relative;
  order: 2;
}

.page {
  display: none;
  height: 100%;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 24px;
}

.page.active { display: block; }

/* ===== INPUT PAGE ===== */
.today-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.today-date {
  display: flex;
  align-items: center;
  gap: 8px;
}

.today-num {
  font-size: 42px;
  font-weight: 700;
  color: var(--pink-deep);
  line-height: 1;
}

.today-info { line-height: 1.5; }
.today-month { font-size: 13px; color: var(--text-light); font-weight: 500; }
.today-week { font-size: 11px; color: var(--text-lighter); }

.today-count {
  background: var(--pink-light);
  color: var(--pink-deep);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

/* Cards */
.card {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 3px 16px var(--shadow);
}

.card-label {
  font-size: 11px;
  color: var(--text-lighter);
  margin-bottom: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

textarea {
  width: 100%;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  resize: none;
  background: transparent;
  line-height: 1.8;
  min-height: 80px;
}

textarea::placeholder { color: var(--text-lighter); }

/* Tags */
.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 10px;
}

.tag {
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  border: 2px solid transparent;
  user-select: none;
}

.tag.selected {
  border-color: currentColor;
  font-weight: 700;
}

.tag-add-btn {
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
  border: 2px dashed var(--text-lighter);
  background: transparent;
  color: var(--text-lighter);
  font-family: inherit;
}

/* Tag colors cycling */
.tag-color-0 { background: var(--pink-light); color: var(--pink-deep); }
.tag-color-1 { background: var(--sage-light); color: #5A8050; }
.tag-color-2 { background: var(--lav-light); color: #7060A0; }
.tag-color-3 { background: var(--yellow-light); color: #907040; }

/* Photo upload */
.photo-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.photo-add {
  width: 72px;
  height: 72px;
  border-radius: 14px;
  border: 2px dashed var(--pink);
  background: var(--pink-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--pink-deep);
  font-size: 22px;
  flex-shrink: 0;
}

.photo-add small { font-size: 9px; margin-top: 2px; }

.photo-item {
  position: relative;
  width: 72px;
  height: 72px;
  flex-shrink: 0;
}

.photo-item img {
  width: 72px;
  height: 72px;
  border-radius: 14px;
  object-fit: cover;
  border: 2px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.photo-remove {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--pink-deep);
  color: white;
  border: none;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

#photo-input { display: none; }

/* Submit */
.submit-btn {
  width: 100%;
  padding: 15px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, var(--pink-btn), #B85878);
  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(200,112,144,0.4);
  transition: all 0.2s;
  margin-top: 4px;
}

.submit-btn:active { transform: scale(0.97); opacity: 0.9; }
.submit-btn:disabled { opacity: 0.6; }

/* Today's entries list */
.today-entries { margin-bottom: 16px; }

.today-entry-item {
  background: white;
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: 0 2px 10px var(--shadow);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  animation: slideUp 0.3s ease;
}

.entry-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pink-deep);
  margin-top: 6px;
  flex-shrink: 0;
}

.entry-body { flex: 1; }
.entry-text { font-size: 14px; line-height: 1.6; margin-bottom: 6px; }
.entry-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.entry-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; }

.entry-photos { display: flex; gap: 5px; flex-wrap: wrap; }
.entry-photo {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  object-fit: cover;
  cursor: pointer;
}

.entry-delete {
  background: none;
  border: none;
  color: var(--text-lighter);
  cursor: pointer;
  font-size: 16px;
  padding: 2px;
  flex-shrink: 0;
}

/* ===== REVIEW PAGE ===== */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  background: white;
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: 0 2px 10px var(--shadow);
}

.nav-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--pink);
  background: white;
  cursor: pointer;
  font-size: 16px;
  color: var(--pink-deep);
  display: flex;
  align-items: center;
  justify-content: center;
}

.month-label { font-size: 16px; font-weight: 700; }

.review-day {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px var(--shadow);
  animation: slideUp 0.3s ease;
}

.review-day-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--pink-light);
}

.review-day-num {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--pink-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--pink-deep);
  flex-shrink: 0;
}

.review-day-weekday { font-size: 12px; color: var(--text-lighter); }

.review-entry {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(242,196,206,0.2);
}

.review-entry:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

.review-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pink);
  margin-top: 7px;
  flex-shrink: 0;
}

.review-text { font-size: 13px; line-height: 1.7; color: var(--text); flex: 1; }
.review-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.review-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; }

.review-photos {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.review-photo {
  width: 80px;
  height: 80px;
  border-radius: 12px;
  object-fit: cover;
  cursor: pointer;
}

.empty-msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-lighter);
  font-size: 14px;
  line-height: 2;
}

/* ===== MEMORY PAGE ===== */
.memory-today {
  text-align: center;
  margin-bottom: 20px;
}

.memory-today-date {
  font-size: 28px;
  font-weight: 700;
  color: var(--pink-deep);
}

.memory-today-sub {
  font-size: 13px;
  color: var(--text-lighter);
  margin-top: 2px;
}

.memory-year-section { margin-bottom: 20px; }

.memory-year-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.memory-year-badge {
  background: var(--pink-light);
  color: var(--pink-deep);
  padding: 4px 14px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
}

.memory-year-ago { font-size: 12px; color: var(--text-lighter); }

.memory-card {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 8px;
  box-shadow: 0 2px 12px var(--shadow);
  border-left: 4px solid var(--pink);
  animation: slideUp 0.3s ease;
}

.memory-entry-text { font-size: 14px; line-height: 1.7; margin-bottom: 8px; }

.memory-photos {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.memory-photo {
  height: 120px;
  border-radius: 12px;
  object-fit: cover;
  flex: 1;
  min-width: 80px;
  max-width: 160px;
  cursor: pointer;
}

/* ===== SETTINGS / BACKUP ===== */
.settings-section {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 12px var(--shadow);
}

.settings-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.action-btn {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 2px solid var(--pink-light);
  background: var(--pink-light);
  color: var(--pink-deep);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.action-btn:last-child { margin-bottom: 0; }
.action-btn.sage { background: var(--sage-light); border-color: var(--sage-light); color: #5A8050; }
.action-btn.lav { background: var(--lav-light); border-color: var(--lav-light); color: #7060A0; }

/* Tag manager */
.tag-manage-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.tag-manage-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 12px;
  border-radius: 14px;
  font-size: 12px;
}

.tag-manage-del {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  color: inherit;
  opacity: 0.6;
  padding: 0;
  line-height: 1;
}

.tag-add-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.tag-add-input {
  flex: 1;
  border: 2px solid var(--pink-light);
  border-radius: 12px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  color: var(--text);
}

.tag-add-input:focus { border-color: var(--pink); }

.tag-add-confirm {
  padding: 8px 16px;
  border-radius: 12px;
  border: none;
  background: var(--pink-deep);
  color: white;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* Stats */
.stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-box {
  flex: 1;
  background: var(--pink-light);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}

.stat-num { font-size: 24px; font-weight: 700; color: var(--pink-deep); }
.stat-label { font-size: 11px; color: var(--text-lighter); margin-top: 2px; }

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 16px; object-fit: contain; }
.lightbox-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 998;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* Loading */
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideUp {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

/* Divider */
.divider { text-align:center; color:var(--pink); font-size:16px; letter-spacing:4px; margin:8px 0 16px; }

#file-import { display:none; }
</style>

<body>

<!-- Header -->
<div class="header">
  <div class="header-deco">🌸 ✦ 🌸</div>
  <div class="header-title">
    M.Y 嘟嘟一家
    <span>育兒日記</span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('input')">
    <span class="tab-icon">✏️</span>記錄
  </button>
  <button class="tab" onclick="switchTab('review')">
    <span class="tab-icon">📅</span>月回顧
  </button>
  <button class="tab" onclick="switchTab('memory')">
    <span class="tab-icon">🔁</span>歷年今天
  </button>
  <button class="tab" onclick="switchTab('settings')">
    <span class="tab-icon">⚙️</span>設定
  </button>
</div>

<!-- Content -->
<div class="content">

  <!-- ===== INPUT PAGE ===== -->
  <div class="page active" id="page-input">

    <div class="today-header">
      <div class="today-date">
        <div class="today-num" id="today-num" style="min-width:44px;min-height:48px;"></div>
        <div class="today-info">
          <div class="today-month" id="today-month"></div>
          <div class="today-week" id="today-week"></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div class="today-count" id="today-count">0 筆紀錄</div>
        <button onclick="toggleDatePicker()" style="font-size:11px;color:var(--text-lighter);background:none;border:none;cursor:pointer;padding:0;">📅 補登過去</button>
      </div>
    </div>
    <div id="date-picker-wrap" style="display:none;margin-bottom:12px;">
      <div style="background:white;border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px var(--shadow);display:flex;align-items:center;gap:10px;">
        <span style="font-size:13px;color:var(--text-light);">📅 補登日期</span>
        <input type="date" id="backdate-input" style="flex:1;border:1.5px solid var(--pink-light);border-radius:10px;padding:6px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none;">
        <button onclick="clearBackdate()" style="font-size:12px;color:var(--text-lighter);background:none;border:none;cursor:pointer;">✕</button>
      </div>
    </div>

    <!-- Today's entries -->
    <div class="today-entries" id="today-entries"></div>

    <!-- New entry form -->
    <div class="card">
      <div class="card-label">📝 新增一筆</div>
      <textarea id="entry-text" rows="3" placeholder="女兒今天⋯⋯想到什麼都可以寫 🌸"></textarea>
    </div>

    <div class="card">
      <div class="card-label">🏷️ 標籤（可複選）</div>
      <div class="tags-row" id="tag-selector"></div>
    </div>

    <div class="card">
      <div class="card-label">📷 照片（選填）</div>
      <div class="photo-grid" id="photo-preview">
        <div class="photo-add" onclick="document.getElementById('photo-input').click()">
          ＋<small>新增</small>
        </div>
      </div>
      <input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotos(event)">
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitEntry()">🌸 儲存這一筆</button>
  </div>

  <!-- ===== REVIEW PAGE ===== -->
  <div class="page" id="page-review">
    <!-- Date jump pills -->
  <div id="review-date-pills" style="display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;"></div>
  <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="review-month-label">載入中</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div id="review-content"></div>

  <!-- Export overlay -->
  <div id="export-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
    <div id="export-card" style="background:white;border-radius:24px;padding:20px;max-width:340px;width:90%;max-height:80vh;overflow-y:auto;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="saveExportImage()" style="padding:12px 24px;background:#D4849A;color:white;border:none;border-radius:20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">💾 儲存圖片</button>
      <button onclick="closeExport()" style="padding:12px 24px;background:rgba(255,255,255,0.2);color:white;border:2px solid rgba(255,255,255,0.4);border-radius:20px;font-size:15px;cursor:pointer;font-family:inherit;">取消</button>
    </div>
  </div>
  </div>

  <!-- ===== MEMORY PAGE ===== -->
  <div class="page" id="page-memory">
    <div class="memory-today">
      <div class="memory-today-date" id="memory-date"></div>
      <div class="memory-today-sub">歷年的這一天 🌿</div>
    </div>
    <div id="memory-content"></div>
  </div>

  <!-- ===== SETTINGS PAGE ===== -->
  <div class="page" id="page-settings">

    <div class="settings-section">
      <div class="settings-title">📊 統計</div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">總筆數</div>
        </div>
        <div class="stat-box" style="background:var(--sage-light);">
          <div class="stat-num" style="color:#5A8050;" id="stat-days">0</div>
          <div class="stat-label">記錄天數</div>
        </div>
        <div class="stat-box" style="background:var(--lav-light);">
          <div class="stat-num" style="color:#7060A0;" id="stat-photos">0</div>
          <div class="stat-label">照片數</div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title">🏷️ 管理標籤</div>
      <div class="tag-manage-list" id="tag-manage-list"></div>
      <div class="tag-add-row">
        <input type="text" class="tag-add-input" id="new-tag-input" placeholder="新增標籤名稱" maxlength="10">
        <button class="tag-add-confirm" onclick="addTag()">新增</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-title">💾 備份與還原</div>
      <button class="action-btn" onclick="exportCSV()">📄 匯出 CSV（文字＋連結）</button>
      <button class="action-btn sage" onclick="exportZIP()">📦 匯出 ZIP（含照片）</button>
      <button class="action-btn lav" onclick="document.getElementById('file-import').click()">📥 匯入備份</button>
      <input type="file" id="file-import" accept=".json" onchange="importBackup(event)">
    </div>

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAFGSQOvAp1thZkWBZ-nLHe-uR8llDQDI8",
  authDomain: "home-hub-be41f.firebaseapp.com",
  projectId: "home-hub-be41f",
  storageBucket: "home-hub-be41f.firebasestorage.app",
  messagingSenderId: "286497032414",
  appId: "1:286497032414:web:16d3f0242a400d0de85a4f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Cloudinary config
const CLOUDINARY_CLOUD = 'dxd5ijwof';
const CLOUDINARY_PRESET = 'ml_default';

async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
    method: 'POST',
    body: formData
  });
  const data = await res.json();
  if (!data.secure_url) throw new Error('上傳失敗');
  return data.secure_url;
}

// ===== STATE =====
let allEntries = [];
let pendingPhotos = []; // { file, dataUrl }
let selectedTags = [];
let userTags = [];
let reviewYear = new Date().getFullYear();
let reviewMonth = new Date().getMonth(); // 0-indexed

const TAG_COLORS = ['tag-color-0','tag-color-1','tag-color-2','tag-color-3'];
const WEEKDAYS = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
const MONTHS_ZH = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// ===== INIT =====
async function init() {
  updateTodayHeader();
  try {
    await loadTags();
    await loadEntries();
    renderTagSelector();
    renderTodayEntries();
    renderReview();
    renderMemory();
    updateStats();
  } catch(e) {
    console.error('Init error:', e);
    showToast('⚠️ 載入失敗，請確認 Firebase 設定');
    renderTagSelector();
  }
}

function updateTodayHeader() {
  const now = new Date();
  document.getElementById('memory-date').textContent = `${MONTHS_ZH[now.getMonth()]} ${now.getDate()}日`;
  document.getElementById('review-month-label').textContent = `${reviewYear}年 ${MONTHS_ZH[reviewMonth]}`;
  updateDisplayDate();
}

function updateDisplayDate() {
  const dateStr = getEntryDate();
  const d = new Date(dateStr + 'T12:00:00');
  document.getElementById('today-num').textContent = d.getDate();
  document.getElementById('today-month').textContent = `${d.getFullYear()}年 ${MONTHS_ZH[d.getMonth()]}`;
  document.getElementById('today-week').textContent = WEEKDAYS[d.getDay()];
  renderTodayEntries();
}

// ===== TAGS =====
async function loadTags() {
  try {
    const snap = await getDoc(doc(db, 'diary_settings', 'tags'));
    if (snap.exists()) {
      userTags = snap.data().list || defaultTags();
    } else {
      userTags = defaultTags();
      await saveTags();
    }
  } catch(e) {
    userTags = defaultTags();
  }
}

function defaultTags() {
  return ['🍼 吃飯','👣 第一次','😂 好笑','💬 說話','🎮 玩耍','✈️ 外出','🏥 健康','😴 睡覺'];
}

async function saveTags() {
  await setDoc(doc(db, 'diary_settings', 'tags'), { list: userTags });
}

function renderTagSelector() {
  const wrap = document.getElementById('tag-selector');
  wrap.innerHTML = '';
  userTags.forEach((tag, i) => {
    const el = document.createElement('div');
    el.className = `tag ${TAG_COLORS[i % 4]}${selectedTags.includes(tag) ? ' selected' : ''}`;
    el.textContent = tag;
    el.onclick = () => {
      if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
        el.classList.remove('selected');
      } else {
        selectedTags.push(tag);
        el.classList.add('selected');
      }
    };
    wrap.appendChild(el);
  });
}

function renderTagManager() {
  const wrap = document.getElementById('tag-manage-list');
  wrap.innerHTML = '';
  userTags.forEach((tag, i) => {
    const el = document.createElement('div');
    el.className = `tag-manage-item ${TAG_COLORS[i % 4]}`;
    el.innerHTML = `<span>${tag}</span><button class="tag-manage-del" onclick="removeTag(${i})">✕</button>`;
    wrap.appendChild(el);
  });
}

window.addTag = async function() {
  const input = document.getElementById('new-tag-input');
  const val = input.value.trim();
  if (!val) return;
  if (userTags.includes(val)) { showToast('標籤已存在'); return; }
  userTags.push(val);
  await saveTags();
  input.value = '';
  renderTagManager();
  renderTagSelector();
  showToast('✅ 新增成功');
};

window.removeTag = async function(idx) {
  if (!confirm(`刪除標籤「${userTags[idx]}」？`)) return;
  userTags.splice(idx, 1);
  await saveTags();
  renderTagManager();
  renderTagSelector();
};

// ===== ENTRIES =====
async function loadEntries() {
  try {
    const q = query(collection(db, 'diary_entries'), orderBy('timestamp', 'desc'));
    const snap = await getDocs(q);
    allEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) {
    allEntries = [];
    showToast('⚠️ 載入失敗，請檢查網路');
  }
}

let selectedBackdate = null;

window.toggleDatePicker = function() {
  const wrap = document.getElementById('date-picker-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
  if (wrap.style.display === 'block') {
    document.getElementById('backdate-input').value = todayStr();
    selectedBackdate = null;
    document.getElementById('backdate-input').onchange = e => {
      selectedBackdate = e.target.value || null;
      updateDisplayDate();
    };
  }
};

window.clearBackdate = function() {
  selectedBackdate = null;
  document.getElementById('date-picker-wrap').style.display = 'none';
  updateDisplayDate();
};

function getEntryDate() {
  return selectedBackdate || todayStr();
}

function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

function renderTodayEntries() {
  const today = getEntryDate();
  const entries = allEntries.filter(e => e.dateStr === today).sort((a,b) => (a.timestamp||'').localeCompare(b.timestamp||''));
  const wrap = document.getElementById('today-entries');
  wrap.innerHTML = '';
  document.getElementById('today-count').textContent = `${entries.length} 筆紀錄`;

  entries.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'today-entry-item';
    const entryTime = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit',hour12:false}) : '';
    div.innerHTML = `
      <div class="entry-dot"></div>
      <div class="entry-body">
        <div class="entry-text">${escHtml(entry.text)}</div>
        ${entry.tags?.length ? `<div class="entry-tags">${entry.tags.map((t,i)=>`<span class="entry-tag ${TAG_COLORS[i%4]}">${escHtml(t)}</span>`).join('')}</div>` : ''}
        ${entry.photos?.length ? `<div class="entry-photos">${entry.photos.map(url=>`<img class="entry-photo" src="${url}" onclick="openLightbox('${url}')" loading="lazy">`).join('')}</div>` : ''}
        ${entryTime ? `<div style="font-size:10px;color:var(--text-lighter);margin-top:6px;">${entryTime}</div>` : ''}
      </div>
      <button class="entry-delete" onclick="deleteEntry('${entry.id}', ${JSON.stringify(entry.photos||[]).replace(/"/g,'&quot;')})">✕</button>
    `;
    wrap.appendChild(div);
  });
}

// ===== PHOTOS =====
window.handlePhotos = async function(e) {
  const files = Array.from(e.target.files);
  for (const file of files) {
    const compressed = await compressImage(file, 1200, 0.82);
    const dataUrl = await fileToDataUrl(compressed);
    pendingPhotos.push({ file: compressed, dataUrl });
  }
  renderPhotoPreview();
  e.target.value = '';
};

function renderPhotoPreview() {
  const wrap = document.getElementById('photo-preview');
  wrap.innerHTML = `<div class="photo-add" onclick="document.getElementById('photo-input').click()">＋<small>新增</small></div>`;
  pendingPhotos.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.innerHTML = `<img src="${p.dataUrl}"><button class="photo-remove" onclick="removePhoto(${i})">✕</button>`;
    wrap.appendChild(item);
  });
}

window.removePhoto = function(i) {
  pendingPhotos.splice(i, 1);
  renderPhotoPreview();
};

async function compressImage(file, maxW, quality) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob || file), 'image/jpeg', quality);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
}

function fileToDataUrl(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

// ===== SUBMIT =====
window.submitEntry = async function() {
  const text = document.getElementById('entry-text').value.trim();
  if (!text && pendingPhotos.length === 0) { showToast('請輸入文字或新增照片'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>儲存中...';

  try {
    // Upload photos to Cloudinary
    const photoUrls = [];
    for (const p of pendingPhotos) {
      const url = await uploadToCloudinary(p.file);
      photoUrls.push(url);
    }

    const entryDateStr = getEntryDate();
    const entryDate = new Date(entryDateStr + 'T12:00:00');
    const now = new Date();
    const entry = {
      text,
      tags: [...selectedTags],
      photos: photoUrls,
      dateStr: entryDateStr,
      timestamp: selectedBackdate ? (entryDateStr + 'T12:00:00.000Z') : now.toISOString(),
      year: entryDate.getFullYear(),
      month: entryDate.getMonth() + 1,
      day: entryDate.getDate()
    };

    const docRef = await addDoc(collection(db, 'diary_entries'), entry);
    allEntries.unshift({ id: docRef.id, ...entry });

    // Reset
    document.getElementById('entry-text').value = '';
    selectedTags = [];
    pendingPhotos = [];
    renderPhotoPreview();
    renderTagSelector();
    renderTodayEntries();
    updateStats();
    showToast('🌸 儲存成功！');
  } catch(e) {
    showToast('❌ 儲存失敗：' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '🌸 儲存這一筆';
};

window.deleteEntry = async function(id, photos) {
  if (!confirm('刪除這筆紀錄？')) return;
  try {
    await deleteDoc(doc(db, 'diary_entries', id));
    // Note: Cloudinary photos are kept (free plan doesn't need cleanup)
    allEntries = allEntries.filter(e => e.id !== id);
    renderTodayEntries();
    renderReview();
    updateStats();
    showToast('🗑 已刪除');
  } catch(e) {
    showToast('❌ 刪除失敗');
  }
};

// ===== REVIEW =====
window.changeMonth = function(dir) {
  reviewMonth += dir;
  if (reviewMonth < 0) { reviewMonth = 11; reviewYear--; }
  if (reviewMonth > 11) { reviewMonth = 0; reviewYear++; }
  document.getElementById('review-month-label').textContent = `${reviewYear}年 ${MONTHS_ZH[reviewMonth]}`;
  renderReview();
};

function renderReview() {
  const wrap = document.getElementById('review-content');
  const entries = allEntries.filter(e => e.year === reviewYear && e.month === reviewMonth + 1);

  if (!entries.length) {
    wrap.innerHTML = `<div class="empty-msg">🌱<br>這個月還沒有紀錄<br>快去記錄點什麼吧！</div>`;
    return;
  }

  // Group by day
  const byDay = {};
  entries.forEach(e => {
    if (!byDay[e.day]) byDay[e.day] = [];
    byDay[e.day].push(e);
  });
  Object.keys(byDay).forEach(day => {
    byDay[day].sort((a,b) => (a.timestamp||'').localeCompare(b.timestamp||''));
  });

  const days = Object.keys(byDay).map(Number).sort((a,b) => b-a);
  wrap.innerHTML = '';
  renderDatePills();

  days.forEach(day => {
    const dayEntries = byDay[day];
    const date = new Date(reviewYear, reviewMonth, day);
    const weekday = WEEKDAYS[date.getDay()];

    // Collect all photos for this day
    const allPhotos = dayEntries.flatMap(e => e.photos || []);

    const div = document.createElement('div');
    div.className = 'review-day';
    div.id = 'review-day-' + day;
    div.innerHTML = `
      <div class="review-day-header">
        <div class="review-day-num">${day}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;">${reviewYear}年${MONTHS_ZH[reviewMonth]}${day}日</div>
          <div class="review-day-weekday">${weekday} · ${dayEntries.length}筆紀錄</div>
        </div>
        <button onclick="openExport(${day})" style="font-size:18px;background:none;border:none;cursor:pointer;padding:4px;">🖼</button>
      </div>
      ${dayEntries.map((e,i) => `
        <div class="review-entry">
          <div class="review-dot"></div>
          <div>
            <div class="review-text">${escHtml(e.text)}</div>
            ${e.tags?.length ? `<div class="review-tags">${e.tags.map((t,j)=>`<span class="review-tag ${TAG_COLORS[j%4]}">${escHtml(t)}</span>`).join('')}</div>` : ''}
            ${e.timestamp ? `<div style="font-size:10px;color:var(--text-lighter);margin-top:4px;">${new Date(e.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}</div>` : ''}
          </div>
        </div>
      `).join('')}
      ${allPhotos.length ? `
        <div class="review-photos">
          ${allPhotos.map(url => `<img class="review-photo" src="${url}" onclick="openLightbox('${url}')" loading="lazy">`).join('')}
        </div>
      ` : ''}
    `;
    wrap.appendChild(div);
  });
}

// ===== MEMORY =====
function renderMemory() {
  const now = new Date();
  const todayMonth = now.getMonth() + 1;
  const todayDay = now.getDate();
  const thisYear = now.getFullYear();

  const wrap = document.getElementById('memory-content');

  const pastEntries = allEntries.filter(e =>
    e.month === todayMonth && e.day === todayDay && e.year < thisYear
  );

  if (!pastEntries.length) {
    wrap.innerHTML = `<div class="empty-msg">🌱<br>還沒有歷年紀錄<br>繼續記錄，明年就能回顧了！</div>`;
    return;
  }

  // Group by year
  const byYear = {};
  pastEntries.forEach(e => {
    if (!byYear[e.year]) byYear[e.year] = [];
    byYear[e.year].push(e);
  });

  const years = Object.keys(byYear).map(Number).sort((a,b) => b-a);
  wrap.innerHTML = '';

  years.forEach(year => {
    const yEntries = byYear[year];
    const yearsAgo = thisYear - year;
    const allPhotos = yEntries.flatMap(e => e.photos || []);

    const section = document.createElement('div');
    section.className = 'memory-year-section';
    section.innerHTML = `
      <div class="memory-year-label">
        <span class="memory-year-badge">${year}年</span>
        <span class="memory-year-ago">${yearsAgo}年前的今天</span>
      </div>
      ${yEntries.map(e => `
        <div class="memory-card">
          <div class="memory-entry-text">${escHtml(e.text)}</div>
          ${e.tags?.length ? `<div class="review-tags" style="margin-bottom:8px;">${e.tags.map((t,i)=>`<span class="review-tag ${TAG_COLORS[i%4]}">${escHtml(t)}</span>`).join('')}</div>` : ''}
        </div>
      `).join('')}
      ${allPhotos.length ? `
        <div class="memory-photos">
          ${allPhotos.map(url => `<img class="memory-photo" src="${url}" onclick="openLightbox('${url}')" loading="lazy">`).join('')}
        </div>
      ` : ''}
    `;
    wrap.appendChild(section);
  });
}

// ===== STATS =====
function updateStats() {
  document.getElementById('stat-total').textContent = allEntries.length;
  const days = new Set(allEntries.map(e => e.dateStr)).size;
  document.getElementById('stat-days').textContent = days;
  const photos = allEntries.reduce((sum, e) => sum + (e.photos?.length || 0), 0);
  document.getElementById('stat-photos').textContent = photos;
}

// ===== EXPORT =====
window.exportCSV = function() {
  if (!allEntries.length) { showToast('還沒有紀錄'); return; }
  const rows = [['日期','文字','標籤','照片連結']];
  allEntries.forEach(e => {
    rows.push([
      e.dateStr,
      `"${(e.text||'').replace(/"/g,'""')}"`,
      `"${(e.tags||[]).join('、')}"`,
      `"${(e.photos||[]).join('\n')}"`
    ]);
  });
  const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
  downloadFile(csv, 'diary_backup.csv', 'text/csv;charset=utf-8;');
  showToast('📄 CSV 已匯出');
};

window.exportZIP = async function() {
  if (!allEntries.length) { showToast('還沒有紀錄'); return; }
  showToast('📦 準備中，請稍候...');

  // We'll use a simple JSON + instructions approach since JSZip isn't available
  // Export JSON with all data
  const backup = {
    exportDate: new Date().toISOString(),
    entries: allEntries.map(e => ({
      id: e.id,
      text: e.text,
      tags: e.tags,
      photos: e.photos,
      dateStr: e.dateStr,
      timestamp: e.timestamp,
      year: e.year,
      month: e.month,
      day: e.day
    })),
    tags: userTags
  };

  const json = JSON.stringify(backup, null, 2);
  downloadFile(json, `diary_backup_${todayStr()}.json`, 'application/json');
  showToast('💾 備份已匯出（含所有照片連結）');
};

window.importBackup = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm('匯入備份將合併資料，確定繼續？')) return;

  try {
    const text = await file.text();
    const backup = JSON.parse(text);

    let imported = 0;
    for (const entry of (backup.entries || [])) {
      // Check if already exists
      const exists = allEntries.find(ex => ex.id === entry.id);
      if (!exists) {
        const { id, ...data } = entry;
        const docRef = await addDoc(collection(db, 'diary_entries'), data);
        allEntries.push({ id: docRef.id, ...data });
        imported++;
      }
    }

    // Merge tags
    if (backup.tags) {
      const newTags = backup.tags.filter(t => !userTags.includes(t));
      userTags = [...userTags, ...newTags];
      await saveTags();
      renderTagSelector();
      renderTagManager();
    }

    allEntries.sort((a,b) => b.timestamp?.localeCompare(a.timestamp||''));
    renderTodayEntries();
    renderReview();
    renderMemory();
    updateStats();
    showToast(`✅ 匯入完成：${imported} 筆新紀錄`);
  } catch(err) {
    showToast('❌ 匯入失敗，請確認檔案格式');
  }
  e.target.value = '';
};

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ===== UI HELPERS =====
window.switchTab = function(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');

  if (name === 'review') renderReview();
  if (name === 'memory') renderMemory();
  if (name === 'settings') { renderTagManager(); updateStats(); }
};

window.openLightbox = function(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
};

window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ===== DATE PILLS for Review =====
function renderDatePills() {
  const entries = allEntries.filter(e => e.year === reviewYear && e.month === reviewMonth + 1);
  const days = [...new Set(entries.map(e => e.day))].sort((a,b) => b-a);
  const wrap = document.getElementById('review-date-pills');
  if (!wrap) return;
  if (days.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = days.map(d => `
    <button onclick="scrollToDay(${d})" style="flex-shrink:0;padding:4px 12px;border-radius:16px;border:1.5px solid var(--pink-light);background:white;color:var(--pink-deep);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;">${d}日</button>
  `).join('');
}

window.scrollToDay = function(day) {
  const el = document.getElementById('review-day-' + day);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ===== EXPORT =====
window.openExport = function(day) {
  const entries = allEntries.filter(e => e.year === reviewYear && e.month === reviewMonth + 1 && e.day === day)
    .sort((a,b) => (a.timestamp||'').localeCompare(b.timestamp||''));
  if (!entries.length) return;

  const date = new Date(reviewYear, reviewMonth, day);
  const WEEKDAYS_EX = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  const allPhotos = entries.flatMap(e => e.photos || []);

  const card = document.getElementById('export-card');
  card.innerHTML = `
    <div style="font-family:'Zen Maru Gothic',sans-serif;background:#FDF6F0;border-radius:16px;padding:20px;">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:11px;color:#C0AEB4;letter-spacing:3px;margin-bottom:6px;">🌸 M.Y 嘟嘟一家 🌸</div>
        <div style="font-size:28px;font-weight:700;color:#D4849A;line-height:1;">${day}</div>
        <div style="font-size:14px;font-weight:600;color:#5C4A52;margin-top:2px;">${reviewYear}年${MONTHS_ZH[reviewMonth]}${day}日</div>
        <div style="font-size:11px;color:#9C8890;margin-top:2px;">${WEEKDAYS_EX[date.getDay()]}</div>
        <div style="width:40px;height:2px;background:var(--pink-light,#FAE8EC);margin:10px auto 0;border-radius:1px;"></div>
      </div>
      ${entries.map(e => `
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed #F2C4CE;">
          <div style="font-size:13px;line-height:1.8;color:#5C4A52;">${escHtml(e.text)}</div>
          ${e.tags?.length ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;">${e.tags.map(t=>`<span style="font-size:10px;padding:2px 9px;border-radius:10px;background:#FAE8EC;color:#D4849A;">${escHtml(t)}</span>`).join('')}</div>` : ''}
          ${e.timestamp ? `<div style="font-size:10px;color:#C0AEB4;margin-top:5px;">${new Date(e.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}</div>` : ''}
        </div>
      `).join('')}
      ${allPhotos.length ? `
        <div style="display:grid;grid-template-columns:${allPhotos.length===1?'1fr':'1fr 1fr'};gap:8px;margin-top:4px;">
          ${allPhotos.map(url=>`<img src="${url}" style="width:100%;border-radius:12px;object-fit:cover;aspect-ratio:1;" crossorigin="anonymous">`).join('')}
        </div>
      ` : ''}
      <div style="text-align:center;margin-top:14px;font-size:10px;color:#C0AEB4;letter-spacing:2px;">🌷 嘟嘟一家成長日記 🌷</div>
    </div>
  `;

  const overlay = document.getElementById('export-overlay');
  overlay.style.display = 'flex';
};

window.closeExport = function() {
  document.getElementById('export-overlay').style.display = 'none';
};

window.saveExportImage = async function() {
  const card = document.getElementById('export-card').firstElementChild;
  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#FDF6F0'
    });
    const link = document.createElement('a');
    link.download = `嘟嘟日記_${reviewYear}${String(reviewMonth+1).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('🌸 圖片已儲存！');
    closeExport();
  } catch(e) {
    showToast('❌ 儲存失敗，請重試');
  }
};

init();
</script>
</body>
</html>
