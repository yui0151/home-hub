<style>
:root{
  --paper:#FDFBFA;--clay:#A68A7D;--clay-light:#C4A899;--clay-dark:#8A7268;
  --sage:#8FA68B;--wood:#4A423D;--sand:#EAE2D6;--highlight:#D99A84;
  --card:#F9F7F4;--card2:#F4F0EB;--white:#FFFFFF;--text-muted:#9B8E87;
  --serif:'Noto Serif TC',serif;--sans:'Zen Kaku Gothic New',sans-serif;
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{background:var(--paper);color:var(--wood);font-family:var(--sans);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top);}
button{border:none;background:none;cursor:pointer;font-family:var(--sans);}
input,textarea,select{font-family:var(--sans);font-size:16px;}
.app{max-width:480px;margin:0 auto;}
.header{position:sticky;top:0;z-index:50;background:rgba(253,251,250,.92);backdrop-filter:blur(12px);padding:12px 16px 0;border-bottom:1px solid var(--sand);}
.header-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;}
.header-title{font-family:var(--serif);font-size:17px;font-weight:700;}
.header-actions{display:flex;gap:8px;}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--card2);}
/* Tab switcher */
.tab-switch{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:0 16px 10px;}
.tsw{flex:1;padding:7px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);text-align:center;transition:all .15s;}
.tsw.active{background:var(--white);color:var(--wood);box-shadow:0 1px 4px rgba(74,66,61,.1);}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 0;}
.stat-card{background:var(--card);border:1px solid var(--sand);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;}
.stat-num{font-family:var(--serif);font-size:20px;font-weight:700;}
.stat-num.alert{color:var(--highlight);}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;}
/* Search + filter */
.search-row{padding:10px 16px 4px;position:relative;}
.search-input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--sand);border-radius:50px;font-size:14px;color:var(--wood);background:var(--card);outline:none;}
.search-input:focus{border-color:var(--clay);}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.cat-pills{display:flex;gap:6px;padding:6px 16px;overflow-x:auto;}
.cat-pills::-webkit-scrollbar{display:none;}
.cpill{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:12px;border:1.5px solid var(--sand);color:var(--text-muted);background:var(--card);}
.cpill.active{background:var(--wood);border-color:var(--wood);color:white;font-weight:500;}
/* Content */
.content{padding:8px 16px 140px;display:flex;flex-direction:column;gap:6px;}
/* Accordion group */
.acc-group{background:var(--white);border:1px solid var(--sand);border-radius:var(--radius-sm);overflow:hidden;}
.acc-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;}
.acc-header-left{display:flex;align-items:center;gap:8px;}
.acc-icon{font-size:18px;}
.acc-name{font-size:14px;font-weight:500;}
.acc-count{font-size:11px;color:var(--text-muted);background:var(--card2);border-radius:10px;padding:1px 8px;}
.acc-arrow{font-size:12px;color:var(--text-muted);transition:transform .2s;}
.acc-arrow.open{transform:rotate(180deg);}
/* Inventory Item */
.inv-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--sand);cursor:pointer;transition:background .15s;}
.inv-item:active{background:var(--card2);}
.inv-img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--sand);flex-shrink:0;}
.inv-img-ph{width:40px;height:40px;border-radius:8px;background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.inv-body{flex:1;min-width:0;}
.inv-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.inv-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qty-ctrl{display:flex;align-items:center;gap:4px;}

.qty-btn:active{background:var(--sand);}
.qty-num{font-family:var(--serif);font-size:15px;font-weight:700;min-width:24px;text-align:center;}
.qty-num.low{color:var(--highlight);}
/* Low stock warning */
.low-badge{font-size:10px;padding:1px 6px;border-radius:8px;background:#fdf1eb;color:var(--highlight);}
/* Free shopping list */
.shopping-section{padding:0 16px 140px;}
.shop-card{background:var(--white);border:1.5px dashed var(--highlight);border-radius:var(--radius-sm);overflow:hidden;}
.shop-header{background:#fdf1eb;padding:10px 14px;display:flex;align-items:center;gap:6px;}
.shop-header-title{font-size:13px;font-weight:700;color:var(--highlight);}

.ls-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card);border:1px solid var(--sand);border-left:3px solid var(--highlight);border-radius:var(--radius-sm);margin-bottom:5px;font-size:13px;}
.ls-qty{font-size:11px;color:var(--highlight);}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(253,251,250,.95);backdrop-filter:blur(12px);border-top:1px solid var(--sand);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;max-width:480px;margin:0 auto;}

.nav-icon{font-size:22px;}

.modal-footer{padding:12px 20px 0;display:flex;gap:10px;border-top:1px solid var(--sand);}

const firebaseConfig = {

};
const CLOUDINARY_CLOUD='dxd5ijwof';
const CLOUDINARY_PRESET='ml_default';
let db;
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.firestore();db.enablePersistence().catch(()=>{});}catch(e){}

const ROOM_KEY=‘hh_roomCode’;
const CATS=[
{key:‘food’,label:‘食品’,icon:‘🥫’},{key:‘drink’,label:‘飲料’,icon:‘🧃’},
{key:‘frozen’,label:‘冷凍’,icon:‘🧊’},{key:‘clean’,label:‘清潔’,icon:‘🧹’},
{key:‘bath’,label:‘沐浴’,icon:‘🛁’},{key:‘medical’,label:‘醫療’,icon:‘💊’},
{key:‘baby’,label:‘嬰幼兒’,icon:‘🍼’},{key:‘kitchen’,label:‘廚房’,icon:‘🍳’},
{key:‘office’,label:‘文具’,icon:‘📎’},
{key:‘other’,label:‘其他’,icon:‘📦’},
];
const UNITS=[‘個’,‘盒’,‘包’,‘袋’,‘瓶’,‘罐’,‘條’,‘片’,‘顆’,‘kg’,‘g’,‘L’,‘ml’,‘捲’,‘組’,‘雙’,‘件’,‘份’];
function catInfo(key){return CATS.find(c=>c.key===key)||CATS[CATS.length-1];}
function isLow(r){if(r.threshold===0||r.threshold===‘0’)return Number(r.quantity)===0;return Number(r.quantity)<=Number(r.threshold);}

function App(){
const [roomCode]=useState(()=>localStorage.getItem(ROOM_KEY)||’’);
const [items,setItems]=useState([]);
const [mainTab,setMainTab]=useState(()=>{const p=new URLSearchParams(window.location.search);return p.get(‘tab’)||‘inventory’});
const [search,setSearch]=useState(’’);
const [catFilter,setCatFilter]=useState(‘all’);
const [openCats,setOpenCats]=useState({});
const [showAdd,setShowAdd]=useState(false);
const [showDetail,setShowDetail]=useState(null);
const [editMode,setEditMode]=useState(false);
const [showCsv,setShowCsv]=useState(false);
const [csvText,setCsvText]=useState(’’);
const [viewMode,setViewMode]=useState(‘card’);
const [sortBy,setSortBy]=useState(‘name’); // name | createdAt
const [shopping,setShopping]=useState([]);
const [shopInput,setShopInput]=useState(’’);
const [lowDone,setLowDone]=useState(()=>JSON.parse(localStorage.getItem(‘hh_low_done’+’*’+(localStorage.getItem(ROOM_KEY)||’’))||’{}’));
const toggleLow=id=>setLowDone(p=>{const n={…p,[id]:!p[id]};localStorage.setItem(‘hh_low_done’+’*’+room,JSON.stringify(n));return n;});
const removeLow=id=>setLowDone(p=>{const n={…p};delete n[id];localStorage.setItem(‘hh_low_done’+’_’+room,JSON.stringify(n));return n;});

const room=roomCode;

useEffect(()=>{
if(!room||!db)return;
const u1=db.collection(‘inventory’).doc(room).collection(‘items’)
.onSnapshot(snap=>setItems(snap.docs.map(d=>({id:d.id,…d.data()}))),()=>{});
const u2=db.collection(‘shopping’).doc(room).collection(‘items’)
.onSnapshot(snap=>setShopping(snap.docs.map(d=>({id:d.id,…d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))),()=>{});
return()=>{u1();u2();};
},[room]);

const filtered=items.filter(r=>{
const q=search.toLowerCase();
const matchSearch=!q||r.name?.toLowerCase().includes(q)||r.barcode?.includes(q)||r.location?.toLowerCase().includes(q);
const matchCat=catFilter===‘all’||r.category===catFilter;
return matchSearch&&matchCat;
});

const sortedItems=(arr)=>[…arr].sort((a,b)=>{
if(sortBy===‘name’) return (a.name||’’).localeCompare(b.name||’’,‘zh-TW’);
return (b.createdAt||0)-(a.createdAt||0);
});
const byCategory=CATS.map(c=>({…c,items:sortedItems(filtered.filter(r=>r.category===c.key))})).filter(c=>c.items.length>0);
const lowItems=items.filter(isLow);

const updateQty=async(item,delta)=>{
if(!db)return;
const newQty=Math.max(0,Number(item.quantity)+delta);
await db.collection(‘inventory’).doc(room).collection(‘items’).doc(item.id).update({quantity:newQty,updatedAt:Date.now()});
};

const handleSave=async(data)=>{
if(!db)return;
const col=db.collection(‘inventory’).doc(room).collection(‘items’);
if(data.id){
await col.doc(data.id).update({…data,updatedAt:Date.now()});
setShowDetail({…showDetail,…data});setEditMode(false);
}else{
await col.add({…data,createdAt:Date.now(),updatedAt:Date.now()});
setShowAdd(false);
}
};

const handleDelete=async(item)=>{
if(!db||!window.confirm(‘確定刪除？’))return;
await db.collection(‘inventory’).doc(room).collection(‘items’).doc(item.id).delete();
setShowDetail(null);
};

const importCsv=async()=>{
if(!csvText.trim()||!db)return;
const lines=csvText.trim().split(’\n’).slice(1);
const batch=db.batch();
const col=db.collection(‘inventory’).doc(room).collection(‘items’);
lines.forEach(line=>{
const [name,category,quantity,unit,threshold,imageUrl,barcode,location,note]=line.split(’,’).map(s=>s.trim());
if(!name)return;
batch.set(col.doc(),{name,category:category||‘other’,quantity:Number(quantity)||0,unit:unit||‘個’,threshold:Number(threshold)||0,imageUrl:imageUrl||’’,barcode:barcode||’’,location:location||’’,note:note||’’,createdAt:Date.now(),updatedAt:Date.now()});
});
await batch.commit();setShowCsv(false);setCsvText(’’);
};

const addShop=async()=>{
if(!shopInput.trim()||!db)return;
await db.collection(‘shopping’).doc(room).collection(‘items’).add({text:shopInput.trim(),done:false,createdAt:Date.now()});
setShopInput(’’);
};
const toggleShop=async(id)=>{
if(!db)return;
const item=shopping.find(t=>t.id===id);
if(!item)return;
await db.collection(‘shopping’).doc(room).collection(‘items’).doc(id).update({done:!item.done});
};
const delShop=async(id)=>{
if(!db)return;
await db.collection(‘shopping’).doc(room).collection(‘items’).doc(id).delete();
};

if(!file)return;
set(‘imageUrl’,‘上傳中…’);
var fd=new FormData();
fd.append(‘file’,file);
fd.append(‘upload_preset’,CLOUDINARY_PRESET);
fetch(‘https://api.cloudinary.com/v1_1/’+CLOUDINARY_CLOUD+’/image/upload’,{method:‘POST’,body:fd})
.then(function(r){return r.json();})
.then(function(d){
if(d.secure_url){set(‘imageUrl’,d.secure_url);}
else{set(‘imageUrl’,’’);alert(‘上傳失敗’);}
})
.catch(function(err){set(‘imageUrl’,’’);alert(‘上傳失敗：’+err.message);});
};
