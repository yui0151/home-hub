<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 照片上傳工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFBF0;
  --primary: #E4B6B6;
  --primary-dark: #C99090;
  --primary-light: #F5DEDE;
  --text: #4A4644;
  --text-light: #8A7F7D;
  --border: #F0E8E8;
  --white: #FFFFFF;
  --shadow: 0 2px 16px rgba(180,140,140,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 16px 40px;
  max-width: 480px;
  margin: 0 auto;
}

.header {
  text-align: center;
  padding: 20px 0 24px;
}
.header-icon { font-size: 40px; margin-bottom: 8px; }
.header-title { font-size: 20px; font-weight: 700; }
.header-sub { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--primary);
  border-radius: 20px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--white);
  margin-bottom: 16px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--primary-dark);
  background: var(--primary-light);
}
.drop-icon { font-size: 36px; margin-bottom: 10px; }
.drop-text { font-size: 15px; font-weight: 500; color: var(--text); }
.drop-sub { font-size: 12px; color: var(--text-light); margin-top: 6px; }
.drop-btn {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 24px;
  background: var(--primary-dark);
  color: white;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
#file-input { display: none; }

/* Upload list */
.upload-list { display: flex; flex-direction: column; gap: 10px; }

.upload-item {
  background: var(--white);
  border-radius: 16px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 12px;
  align-items: center;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.upload-thumb {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--primary-light);
}

.upload-info { flex: 1; min-width: 0; }
.upload-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

/* Progress bar */
.progress-wrap {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress-bar {
  height: 100%;
  background: var(--primary-dark);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* URL box */
.url-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.url-text {
  flex: 1;
  font-size: 11px;
  color: var(--text-light);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
}
.copy-btn {
  flex-shrink: 0;
  padding: 5px 12px;
  background: var(--primary-dark);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.copy-btn:active { transform: scale(0.96); }
.copy-btn.copied { background: #8FA68B; }

.status-text {
  font-size: 12px;
  color: var(--text-light);
}
.status-error { color: #c0392b; }

/* Clear all */
.clear-btn {
  width: 100%;
  padding: 12px;
  margin-top: 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: transparent;
  color: var(--text-light);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--text);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 999;
  transition: transform 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.tip {
  background: var(--primary-light);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--primary-dark);
  margin-bottom: 16px;
  line-height: 1.7;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📸</div>
  <div class="header-title">照片上傳工具</div>
  <div class="header-sub">上傳照片取得網址，用於走走地標清單</div>
</div>

<div class="tip">
  💡 上傳完成後點「複製」，把網址貼到 Google Sheets 的 <strong>image</strong> 欄位就好！
</div>

<div class="drop-zone" id="dropZone">
  <div class="drop-icon">🌄</div>
  <div class="drop-text">拖曳照片到這裡</div>
  <div class="drop-sub">支援 JPG、PNG、HEIC，可一次多張</div>
  <label class="drop-btn">
    選擇照片
    <input type="file" id="file-input" accept="image/*" multiple>
  </label>
</div>

<div class="upload-list" id="uploadList"></div>
<button class="clear-btn" id="clearBtn" style="display:none" onclick="clearAll()">🗑 清除全部</button>

<div class="toast" id="toast"></div>

<script>
const CLOUD = 'dxd5ijwof';
const PRESET = 'ml_default';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('file-input');
const uploadList = document.getElementById('uploadList');
const clearBtn = document.getElementById('clearBtn');

// File input change
fileInput.addEventListener('change', e => {
  handleFiles(Array.from(e.target.files));
  e.target.value = '';
});

// Drag & drop
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (files.length) handleFiles(files);
});

async function handleFiles(files) {
  clearBtn.style.display = '';
  for (const file of files) {
    await uploadFile(file);
  }
}

async function uploadFile(file) {
  // Create item
  const id = 'item-' + Date.now() + Math.random().toString(36).slice(2);
  const previewUrl = URL.createObjectURL(file);

  const item = document.createElement('div');
  item.className = 'upload-item';
  item.id = id;
  item.innerHTML = `
    <img class="upload-thumb" src="${previewUrl}" alt="">
    <div class="upload-info">
      <div class="upload-name">${file.name}</div>
      <div class="progress-wrap"><div class="progress-bar" style="width:0%"></div></div>
      <div class="status-text">壓縮中...</div>
    </div>
  `;
  uploadList.appendChild(item);

  const bar = item.querySelector('.progress-bar');
  const status = item.querySelector('.status-text');

  try {
    // Compress
    const compressed = await compressImage(file, 1400, 0.85);
    status.textContent = '上傳中...';
    bar.style.width = '30%';

    // Upload
    const fd = new FormData();
    fd.append('file', compressed);
    fd.append('upload_preset', PRESET);

    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct = 30 + Math.round((e.loaded / e.total) * 65);
        bar.style.width = pct + '%';
      }
    };

    const result = await new Promise((resolve, reject) => {
      xhr.onload = () => {
        if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
        else reject(new Error('上傳失敗'));
      };
      xhr.onerror = () => reject(new Error('網路錯誤'));
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`);
      xhr.send(fd);
    });

    bar.style.width = '100%';
    bar.style.background = '#8FA68B';
    URL.revokeObjectURL(previewUrl);

    // Show URL
    const url = result.secure_url;
    item.querySelector('.upload-info').innerHTML = `
      <div class="upload-name">${file.name}</div>
      <div class="url-row">
        <div class="url-text" title="${url}">${url}</div>
        <button class="copy-btn" onclick="copyUrl(this, '${url}')">複製</button>
      </div>
    `;

  } catch (err) {
    bar.style.width = '100%';
    bar.style.background = '#e88';
    status.className = 'status-text status-error';
    status.textContent = '失敗，請重試';
  }
}

function copyUrl(btn, url) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✅ 已複製';
    btn.classList.add('copied');
    showToast('✅ 網址已複製！');
    setTimeout(() => {
      btn.textContent = '複製';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function clearAll() {
  uploadList.innerHTML = '';
  clearBtn.style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function compressImage(file, maxW, quality) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => { resolve(blob || file); URL.revokeObjectURL(url); }, 'image/jpeg', quality);
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}
</script>
</body>
</html>
